version: 1
name: resource_allocation_experiment_1_search_2
description: Compare four mu annealing schedules across activations and depths.

base:
  epochs: 50
  repeat_count: 6
  optimality_evaluation: true
  optimality_test_sample_count: 1
  optimality_train_sample_count: 0
  optimality_validation_sample_count: 0
  optimality_evaluation_batches: 1
  mlflow_upload_model_artifact: true
  checkpoint_upload_mlflow: true
  checkpoint_required: true

grid:
  activation: [silu]
  depth: [4]
  learning_rate: [0.01,0.01]
  schedules:
    rho:
      - kind: constant
        value: 0.0
      - kind: constant
        value: 0.0003
      - kind: constant
        value: 0.0001
      - kind: constant
        value: 0.00003
    rho_ref:
      - kind: match_input
      - kind: constant
        value: 0
    mu:
      - kind: constant
        value: 0
    mu_ref:
      - kind: constant
        value: 0

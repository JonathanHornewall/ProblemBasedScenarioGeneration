version: 1
name: resource_allocation_experiment_1_search_2
description: Compare four mu annealing schedules across activations and depths.

base:
  epochs: 50
  repeat_count: 6

grid:
  activation: [silu]
  depth: [4]
  learning_rate: [0.01,0.01]
  schedules:
    mu:
      - kind: constant
        value: 0.0
      - kind: constant
        value: 0.0003
      - kind: constant
        value: 0.0001
      - kind: constant
        value: 0.00003
    mu_ref:
      - kind: match_input
      - kind: constant
        value: 0
    rho:
      - kind: constant
        value: 0
    rho_ref:
      - kind: constant
        value: 0
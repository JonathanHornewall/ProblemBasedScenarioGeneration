version: 1
name: resource_allocation_experiment_1_search_2
description: Compare four mu annealing schedules across activations and depths.

base:
  epochs: 50
  repeat_count: 3

grid:
  activation: [silu]
  depth: [4]
  schedules:
    mu:
      - kind: constant
        value: 0.0
      - kind: constant
        value: 0.0003
      - kind: constant
        value: 0.001
      - kind: constant
        value: 0.01
      - kind: constant
        value: 0.1
    mu_ref:
      - kind: constant
        value: 0
    rho:
      - kind: constant
        value: 0.0
      - kind: constant
        value: 0.0003
      - kind: constant
        value: 0.0001
      - kind: constant
        value: 0.00003
    rho_ref:
      - kind: match_input
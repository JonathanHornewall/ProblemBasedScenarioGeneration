version: 1
name: transshipment_experiment_1_tiny_q_default
description: Default q-learning transshipment tiny grid search.

base:
  optimality_evaluation: true
  optimality_test_sample_count: 30
  optimality_train_sample_count: 0
  optimality_validation_sample_count: 0
  optimality_evaluation_batches: 1

grid:
  learning_rate: [0.001, 0.0005, 0.0003]
  hidden_size: [64, 128]
  depth: [2, 3]
  batch_size: [8, 16]
  dropout: [0.0]
  seed: [143]

schedules:
  mu:
    kind: geometric
    start: 1.0
    stop: 0.01
  mu_ref:
    kind: match_input
